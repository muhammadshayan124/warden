name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        run: pytest -q --cov=warden --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install build
          python -m build

      - name: Verify the MCP server starts and exposes its tools
        run: |
          python -m pip install dist/*.whl
          python -c "
          import asyncio
          from warden.server import mcp

          async def main():
              tools = await mcp.list_tools()
              names = {t.name for t in tools}
              expected = {
                  'list_directory', 'read_file', 'search_files', 'write_file',
                  'delete_file', 'list_processes', 'run_command', 'kill_process',
                  'launch_app', 'get_system_info',
              }
              assert expected <= names, f'missing tools: {expected - names}'
              print('all', len(names), 'tools registered correctly')

          asyncio.run(main())
          "
